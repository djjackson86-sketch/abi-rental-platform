{% macro customer_fields(branches, notice_version, form_values={}) %}
<h2>Your branch &amp; details</h2><div class="shop-fields"><label>Branch<select name="branch_id" required><option value="">Choose your branch</option>{% for b in branches %}<option value="{{ b.id }}" {% if form_values.get('branch_id')|string==b.id|string %}selected{% endif %}>{{ b.name }}</option>{% endfor %}</select></label><label>Full name<input name="customer_name" maxlength="120" autocomplete="name" required value="{{ form_values.get('customer_name','') }}"></label><label>Email<input name="customer_email" type="email" maxlength="254" autocomplete="email" required value="{{ form_values.get('customer_email','') }}"></label><label>Phone<input name="customer_phone" type="tel" maxlength="30" autocomplete="tel" required value="{{ form_values.get('customer_phone','') }}"></label></div><label>Notes for the branch<textarea name="notes" rows="3" maxlength="2000">{{ form_values.get('notes','') }}</textarea></label><div class="shop-hp" aria-hidden="true"><label>Leave blank<input name="company_website" tabindex="-1" autocomplete="off"></label></div><input type="hidden" name="notice_version" value="{{ notice_version }}"><label class="shop-consent"><input type="checkbox" name="privacy_accepted" value="1" required> I have read the privacy notice and agree to my details being used to handle this enquiry.</label><p class="shop-small"><a href="{{ url_for('public.privacy_notice') }}" target="_blank" rel="noopener">Read the privacy notice ↗</a></p>
{% endmacro %}
