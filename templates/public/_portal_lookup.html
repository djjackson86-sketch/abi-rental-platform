<section class="portal-lookup">
  <h2>Are you already registered with us?</h2>
  <p class="muted">Enter your name and cellphone number and we will tell you whether we already
  have your details. We only ever show your first name and the last four digits of your number.</p>
  {% if lookup_error %}<div class="flash error" role="alert">{{ lookup_error }}</div>{% endif %}
  <form method="post" action="{{ url_for('public.customer_portal_check') if universal else url_for('public.branch_portal_check', slug=branch.public_slug) }}" class="portal-form">
    <label class="portal-field" for="lookup-name">
      <span>Full name</span>
      <input id="lookup-name" name="name" type="text" required>
    </label>
    <label class="portal-field" for="lookup-phone">
      <span>Cellphone number</span>
      <input id="lookup-phone" name="phone" type="tel" inputmode="tel" required>
    </label>
    <button class="btn ghost" type="submit">Check</button>
  </form>
</section>
