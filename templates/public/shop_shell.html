<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000"><title>{{ settings.store_title or 'Sano Trailers' }} | Sano Trailers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bitter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="icon" href="{{ url_for('static',filename='img/favicon-32.png') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/shop.css',v='integrated-1') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/shop-flow.css',v='mobile-2') }}"></head>
<body><a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="wrap bar"><a class="brand" href="{{ url_for('public.store') }}" aria-label="Sano Trailers home"><img src="{{ url_for('static',filename='img/shop/logo-wordmark.png') }}" width="366" height="160" alt="Sano Trailers"></a><nav class="nav" id="primary-nav" aria-label="Main"><a href="{{ url_for('public.store') }}" {% if shop_area=='home' %}class="active"{% endif %}>Home</a><a href="{{ url_for('shop_front.catalogue') }}" {% if shop_area=='shop' %}class="active"{% endif %}>Store</a><a href="{{ url_for('shop_front.hire') }}" {% if shop_area=='hire' %}class="active"{% endif %}>Trailer hire</a><a href="{{ url_for('shop_front.repairs') }}" {% if shop_area=='repairs' %}class="active"{% endif %}>Repairs &amp; service</a></nav><button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="primary-nav"><i></i><i></i><i></i></button><div class="header-actions"><a class="cart-btn" href="{{ url_for('shop_front.cart') }}"><span class="cart-label">Cart</span><span class="cart-count">{{ shop_cart_count or 0 }}</span></a></div></div></header>
<main id="main">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="wrap shop-flashes" role="status">{% for category,message in messages %}<p class="shop-alert {{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block shop_body %}{% endblock %}</main>
<script src="{{ url_for('static',filename='js/shop.js',v='1') }}" defer></script></body></html>
