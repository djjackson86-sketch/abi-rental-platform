<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer privacy notice — {{ settings.company_name }}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f3;color:#1e293b;font:15px/1.65 Arial,sans-serif}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:860px;margin:20px auto;padding:0 18px}.toolbar a,.toolbar button{display:inline-block;padding:9px 15px;border:1px solid #d1d9d4;border-radius:7px;background:white;color:#174d36;font:inherit;text-decoration:none;cursor:pointer}.toolbar button{background:#174d36;color:white}.notice-sheet{max-width:860px;margin:18px auto 30px;padding:38px;background:white;border:1px solid #e2e8f0;border-radius:10px;overflow-wrap:anywhere}.notice-meta{color:#64748b;font-size:12px;margin-bottom:20px;overflow-wrap:anywhere}.notice-content h1{font-size:25px;line-height:1.3;color:#174d36}.notice-content h2{font-size:19px;line-height:1.4;margin-top:26px;color:#174d36}.notice-content h3{font-size:17px}.notice-content table{width:100%;border-collapse:collapse;table-layout:fixed}.notice-content td,.notice-content th{border:1px solid #d1d9d4;padding:8px;text-align:left}.notice-content p,.notice-content li{overflow-wrap:anywhere}.notice-content img{max-width:100%}.notice-content a{color:#174d36}@media(max-width:600px){.notice-sheet{margin:12px;padding:22px}.notice-content h1{font-size:22px}.toolbar{margin:16px auto}}@page{size:A4;margin:18mm}@media print{body{background:white;font-size:10.5pt}.toolbar{display:none}.notice-sheet{max-width:none;margin:0;padding:0;border:none;border-radius:0}.notice-content h1{font-size:19pt}.notice-content h2{font-size:13pt;break-after:avoid}.notice-content h3{break-after:avoid}.notice-content p,.notice-content li{orphans:3;widows:3}.notice-content a{color:inherit;text-decoration:none}.notice-content table{break-inside:auto}.notice-content tr{break-inside:avoid}.notice-content thead{display:table-header-group}}
</style></head><body>
<nav class="toolbar" aria-label="Notice actions"><a href="{{ url_for('settings.popia_wizard_index') }}">Back to POPIA settings</a><div><a href="{{ url_for('settings.popia_notice_pdf') }}">Download PDF</a> <button type="button" id="print-notice">Print notice</button></div></nav>
<main class="notice-sheet"><p class="notice-meta">Published version: {{ published.notice_version }}<br>Published: {{ published.published_at }}</p><article class="notice-content">{{ notice_html }}</article></main>
<script>document.getElementById('print-notice').addEventListener('click',function(){window.print();});</script>
</body></html>
